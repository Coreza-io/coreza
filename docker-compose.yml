version: '3.8'

services:
  # =============================================================================
  # Node.js Backend Service
  # =============================================================================
  coreza-backend:
    build:
      context: .
      dockerfile: coreza-backend/Dockerfile
      target: production
    container_name: coreza-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8081:8081"  # WebSocket port
    environment:
      - NODE_ENV=production
      - PORT=8000
      - WEBSOCKET_PORT=8081
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - COREZA_ENCRYPTION_KEY=${COREZA_ENCRYPTION_KEY}
    depends_on:
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - coreza-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # =============================================================================
  # Market Stream Service (Single Instance)
  # =============================================================================
  market-stream-service:
    build:
      context: ./coreza-backend/market-stream-service
      dockerfile: Dockerfile
    container_name: market-stream-service
    restart: unless-stopped
    ports:
      - "8090:8090"  # Health check / metrics port
    environment:
      - NODE_ENV=production
      - MARKET_STREAM_PORT=8090
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - COREZA_ENCRYPTION_KEY=${COREZA_ENCRYPTION_KEY}
    depends_on:
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - coreza-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8090/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1  # CRITICAL: Must be exactly 1 instance
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # =============================================================================
  # Redis Services
  # =============================================================================
  # QUEUE REDIS - Latency Critical (NO PERSISTENCE)
  redis-queue:
    image: redis:7-alpine
    container_name: coreza-redis-queue
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - coreza-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # CACHE REDIS - Medium Latency (Optional Persistence)
  redis-cache:
    image: redis:7-alpine
    container_name: coreza-redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis-cache-data:/data
    networks:
      - coreza-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # =============================================================================
  # Development Services (only for development)
  # =============================================================================
  coreza-backend-dev:
    build:
      context: .
      dockerfile: coreza-backend/Dockerfile
      target: development
    container_name: coreza-backend-dev
    ports:
      - "8000:8000"
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=development
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
    depends_on:
      - redis-queue
      - redis-cache
    networks:
      - coreza-network
    volumes:
      - ./coreza-backend/src:/app/coreza-backend/src
      - /app/coreza-backend/node_modules
    profiles:
      - development

  # =============================================================================
  # Monitoring Services
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: coreza-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - coreza-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: coreza-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - coreza-network
    profiles:
      - monitoring

  # =============================================================================
  # Load Balancer (NGINX)
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: coreza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - coreza-backend
    networks:
      - coreza-network
    profiles:
      - production


  frontend:
    build: .
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    depends_on:
      - coreza-backend
    networks:
      - coreza-network

# =============================================================================
# Networks and Volumes
# =============================================================================
networks:
  coreza-network:
    driver: bridge

volumes:
  redis-cache-data:
  prometheus-data:
  grafana-data:
