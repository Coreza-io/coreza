<svg width="320" height="120" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="120" rx="16" fill="#0F172A"/>
  <path d="M40 60 C110 10, 210 110, 280 60" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <path d="M40 60 C110 10, 210 110, 280 60" stroke="#38BDF8" stroke-width="20" stroke-linecap="round" opacity="0.25" filter="url(#plugGlow)"/>
  <circle cx="160" cy="60" r="14" fill="url(#spark)" filter="url(#sparkGlow)"/>
  <g transform="translate(40 60) rotate(-26)">
    <rect x="-20" y="-10" width="24" height="20" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
    <rect x="4" y="-6" width="8" height="12" rx="2" fill="#38BDF8"/>
    <rect x="14" y="-4" width="4" height="8" rx="1.5" fill="#F8FAFC" opacity="0.9"/>
  </g>
  <g transform="translate(280 60) rotate(154)">
    <rect x="-20" y="-10" width="24" height="20" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
    <rect x="4" y="-6" width="8" height="12" rx="2" fill="#38BDF8"/>
    <rect x="14" y="-4" width="4" height="8" rx="1.5" fill="#F8FAFC" opacity="0.9"/>
  </g>
  <defs>
    <radialGradient id="spark" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 60) rotate(90) scale(14)">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="plugGlow" x="0" y="0" width="320" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sparkGlow" x="120" y="20" width="80" height="80" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
