<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <!-- Resistance lines (red) -->
  <line x1="2" y1="6" x2="22" y2="6" stroke="#ef4444" stroke-dasharray="4 2"/>
  <line x1="2" y1="10" x2="22" y2="10" stroke="#ef4444" stroke-dasharray="4 2"/>
  
  <!-- Price action (blue zigzag) -->
  <polyline points="2,14 6,10 10,16 14,8 18,14 22,12" stroke="#3b82f6" fill="none" stroke-width="1.5"/>
  
  <!-- Support lines (green) -->
  <line x1="2" y1="18" x2="22" y2="18" stroke="#22c55e" stroke-dasharray="4 2"/>
  <line x1="2" y1="22" x2="22" y2="22" stroke="#22c55e" stroke-dasharray="4 2"/>
</svg>
